<!-- 상담 신청 폼 공통 조각. 페이지에서는 <!--FORM subject="검정고시" grade="1" card="light" labels="adult"--> 로 넣습니다. labels="adult" 이면 성함·연락처로 표시.
     {{P}} = 페이지별 id 접두어, {{GRADE}} = 학년 선택(홈만), {{SUBJECTS}} = 희망 과목 체크박스, {{CARD}} = 카드 색상 클래스 -->
<div class="form-card {{CARD}} anim" data-anim="fadeInUp">
  <form class="inq-form" data-subject="{{SUBJECT}}" novalidate>
    <div class="form-row">
      <div class="field"><label for="{{P}}name">{{L_NAME}} <span class="req">*</span></label><input id="{{P}}name" name="name" type="text" placeholder="{{L_NAME}}" required autocomplete="off" /></div>
      <div class="field"><label for="{{P}}phone1">{{L_PHONE}} <span class="req">*</span></label>
        <div class="phone-3">
          <input id="{{P}}phone1" data-phone type="tel" inputmode="numeric" maxlength="3" placeholder="010" />
          <span class="phone-sep">-</span>
          <input data-phone type="tel" inputmode="numeric" maxlength="4" placeholder="0000" />
          <span class="phone-sep">-</span>
          <input data-phone type="tel" inputmode="numeric" maxlength="4" placeholder="0000" />
        </div>
      </div>
    </div>
    {{GRADE}}
    <div class="field">
      <label>희망 과목</label>
      <div class="subj-pick">{{SUBJECTS}}</div>
    </div>
    <div class="field full">
      <label for="{{P}}postcode">주소 <span class="req">*</span></label>
      <div class="addr-row">
        <input id="{{P}}postcode" name="postcode" type="text" placeholder="우편번호" readonly />
        <button type="button" class="addr-btn" data-addr-search>주소 찾기</button>
      </div>
      <input name="addrRoad" type="text" placeholder="도로명 주소" readonly />
      <input name="addrDetail" type="text" placeholder="상세주소 (동·호수 등)" required />
    </div>
    <div class="field full"><label for="{{P}}message">문의 내용</label><textarea id="{{P}}message" name="message" placeholder="현재 성적, 고민, 원하는 수업 방식 등을 자유롭게 적어주세요."></textarea></div>
    <!-- 스팸 방지용 숨김 칸 (사람은 채우지 않음) -->
    <div class="hp-field" aria-hidden="true"><label for="{{P}}hp">홈페이지</label><input id="{{P}}hp" name="hp" type="text" tabindex="-1" autocomplete="off" /></div>
    <button type="submit" class="btn-submit">상담 신청하기</button>
    <p class="form-note">남겨주신 정보는 상담 안내 목적으로만 사용됩니다.</p>
  </form>
  <div class="form-success">
    <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg></div>
    <h3>신청이 접수되었어요!</h3>
    <p>확인 후 빠르게 연락드리겠습니다. 감사합니다.</p>
  </div>
</div>
