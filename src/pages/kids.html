<div class="iw">
  <div class="wrap iw-head">
    <h1>유·초등 수업</h1>
    <p class="iw-lede">아이의 가능성을 키우는 <b>따뜻한 맞춤형 학습</b>으로<br>아이의 성장을 함께합니다.</p>
    <p class="iw-sub">공부 속도를 재촉하지 않고, 방향을 함께 맞추며<br>아이 한 명, 한 명의 가능성을 믿고 스스로 성장하는 힘을 길러줍니다.</p>
  </div>

  <div class="wrap iw-band">
    <img class="only-pc" src="/img/kids/hero-pc.png" alt="책을 든 초등학생 두 명" width="1920" height="960" loading="eager">
    <img class="only-m" src="/img/kids/hero-m.png" alt="책을 든 초등학생 두 명" width="720" height="600" loading="eager">
  </div>

  <div class="wrap iw-band">
    <img class="only-pc" src="/img/kids/who-pc.png" alt="이런 아이에게 추천합니다 — 학습 습관을 잡고 싶은 아이, 개념은 알지만 문제 해결력이 부족한 아이, 공부에 대한 자신감을 키우고 싶은 아이, 성취감을 느끼며 차근차근 성장하고 싶은 아이" width="1480" height="750" loading="lazy">
    <img class="only-m" src="/img/kids/who-m.png" alt="이런 아이에게 추천합니다 — 학습 습관을 잡고 싶은 아이, 공부에 대한 자신감을 키우고 싶은 아이, 개념은 알지만 문제 해결력이 부족한 아이, 성취감을 느끼며 차근차근 성장하고 싶은 아이" width="720" height="894" loading="lazy">
  </div>

  <div class="wrap iw-band">
    <img class="only-pc" src="/img/kids/how-pc.jpg" alt="레벨업과외 진행방식 — 1:1 맞춤 수업, 레벨업 수업 리포트 제공, 체계적인 커리큘럼 제공, 월 1회 학부모 피드백" width="1632" height="877" loading="lazy">
    <img class="only-m" src="/img/kids/how-m.png" alt="레벨업과외 진행방식 — 1:1 맞춤 수업, 레벨업 수업 리포트 제공, 체계적인 커리큘럼 제공, 월 1회 학부모 피드백" width="720" height="1340" loading="lazy">
  </div>

  <div class="wrap iw-band">
    <img class="only-pc" src="/img/kids/curriculum-pc.png" alt="유·초등 학습과목과 학습연령 커리큘럼 표 — 교과수업(전과목), 한자, 한국사·사회, 독서코칭, 논술코칭, 한글·수학·영어코칭" width="1200" height="1495" loading="lazy">

  </div>

  <div class="wrap iw-band tight">
    <img class="only-pc" src="/img/kids/faq1-pc.png" alt="자주 묻는 질문 — 우리 아이는 기초가 너무 약한데 괜찮을까요?" width="1628" height="430" loading="lazy">
    <img class="only-pc" src="/img/kids/faq2-pc.png" alt="자주 묻는 질문 — 수업은 어떤 교재나 자료를 사용하나요?" width="1628" height="424" loading="lazy">
    <img class="only-pc" src="/img/kids/faq3-pc.png" alt="자주 묻는 질문 — 아이가 수업에 집중하지 못할까봐 걱정돼요." width="1628" height="482" loading="lazy">
    <img class="only-pc" src="/img/kids/faq4-pc.png" alt="자주 묻는 질문 — 어떤 선생님과 수업하나요?" width="1628" height="453" loading="lazy">
    <img class="only-m" src="/img/kids/faq-m.png" alt="자주 묻는 질문 — 기초가 약해도 괜찮은지, 어떤 교재를 쓰는지, 집중을 못할까 걱정되는지에 대한 답변" width="725" height="1266" loading="lazy">
  </div>

  <div class="wrap iw-head" style="padding-bottom:0">
    <h2 class="iw-lede" style="font-size:26px;font-weight:800;color:#000">우리 아이에게 꼭 맞는 과외를 경험해 보세요</h2>
    <p class="iw-sub">지금 무료 모의수업 또는 상담을 신청하실 수 있습니다.</p>
  </div>
</div>
