name = "level-up-lesson"
main = "leveluplesson_worker.js"
compatibility_date = "2025-06-01"

# ── 정적 자산 (public/logo.png → https://level-up-lesson.com/logo.png) ──
# og:image 가 /logo.png 를 가리키는데 라우트가 없어 404 였다.
# 자산에 없는 주소는 기존대로 워커가 처리한다.
[assets]
directory = "./public/"

# ── 매일 자동 색인 제출(IndexNow) 실행 시각: UTC 03:00 = 한국시간 12:00 ──
[triggers]
crons = ["0 3 * * *"]

# ── 상담 신청 메일 알림 (Cloudflare Email Routing) ──
# 먼저 대시보드에서 Email Routing을 켜고, 받을 메일 주소를
# Destination Address로 등록·인증해야 합니다.
# 받는 주소는 아래 destination_address 와 워커 코드의 기본값에 함께 두었습니다.
# 대시보드 환경변수 NOTIFY_TO 로 덮어쓸 수 있습니다.
[[send_email]]
name = "NOTIFY"
destination_address = "hhhyunee3@naver.com"

# ── 커스텀 도메인 연결 (도메인이 Cloudflare에 등록되어 있어야 함) ──
# routes = [
#   { pattern = "level-up-lesson.com/*", zone_name = "level-up-lesson.com" }
# ]

# ── 상담 신청을 KV에 저장하려면 주석 해제 후 id 입력 ──
# (먼저 실행:  wrangler kv namespace create INQUIRIES  → 출력된 id 사용)
# [[kv_namespaces]]
# binding = "INQUIRIES"
# id = "여기에_네임스페이스_id"
